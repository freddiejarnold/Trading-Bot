name: Trading scan

on:
  schedule:
    # All times UTC. BST = UTC+1 (summer), GMT = UTC+0 (winter)
    # ── Morning brief — 9:00 AM ET = 2:00 PM BST ──
    - cron: '0 13 * * 1-5'
    # ── Scans every 45 min during market hours ──
    - cron: '45 13 * * 1-5'   # 9:45 AM ET  (open)
    - cron: '30 14 * * 1-5'   # 10:30 AM ET
    - cron: '15 15 * * 1-5'   # 11:15 AM ET
    - cron: '0 16 * * 1-5'    # 12:00 PM ET
    - cron: '45 16 * * 1-5'   # 12:45 PM ET
    - cron: '30 17 * * 1-5'   # 1:30 PM ET
    - cron: '15 18 * * 1-5'   # 2:15 PM ET
    - cron: '45 18 * * 1-5'   # 2:45 PM ET  (pre-close)
    # ── Weekly review — Sunday 6 PM ET ──
    - cron: '0 22 * * 0'
    # ── Monthly dual momentum — first Monday 9 AM ET ──
    - cron: '0 13 1-7 * 1'

  workflow_dispatch:
    inputs:
      scan_type:
        description: 'Scan type'
        required: false
        default: 'full'
        type: choice
        options: [full, morning_brief, weekly_review, dual_mom, weekly_exit]

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore state files
        uses: actions/cache@v4
        with:
          path: |
            state.json
            position_state.json
          key: bot-state-${{ github.run_id }}
          restore-keys: |
            bot-state-

      - name: Clear cache
        run: find . -name "*.pyc" -delete && find . -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true

      - name: Run scan
        run: python run_scan.py --scan_type ${{ github.event.inputs.scan_type || 'full' }}
        env:
          ALPACA_API_KEY:     ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY:  ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_BASE_URL:    https://paper-api.alpaca.markets
          FINNHUB_KEY:        ${{ secrets.FINNHUB_KEY }}
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          SCAN_TYPE:               ${{ github.event.inputs.scan_type || 'full' }}
          DASHBOARD_ARTIFACT_ID:   ${{ secrets.DASHBOARD_ARTIFACT_ID }}

      - name: Save state files
        uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            state.json
            position_state.json
          key: bot-state-${{ github.run_id }}

      - name: Commit trade log
        if: always()
        run: |
          git config user.name "Trading Bot"
          git config user.email "bot@trading"
          git add trade_log.json || true
          git diff --staged --quiet || git commit -m "Update trade log [skip ci]"
          git push || true
